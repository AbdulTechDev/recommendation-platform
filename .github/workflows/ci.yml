name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  API_HOST_PORT: 5050
  POSTGRES_DB: recommendationdb
  POSTGRES_USER: recommendation_user
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  JWT_KEY: ${{ secrets.JWT_KEY }}

jobs:
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build compose images
        run: docker compose build --pull

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do 
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ env.API_HOST_PORT }} || echo 000); 
            echo "code=$code"; 
            if [ "$code" = "200" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then echo "API ready"; exit 0; fi; 
            sleep 2; 
          done; 
          echo "API not ready"; exit 1

      - name: Run tests in SDK container attached to compose network
        run: |
          NETWORK_NAME="${GITHUB_REPOSITORY##*/}_default"
          echo "Using docker network: $NETWORK_NAME"
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src/tests/Recommendation.Api.Tests --network "$NETWORK_NAME" mcr.microsoft.com/dotnet/sdk:10.0 bash -lc "dotnet restore && dotnet test -c Release"

      - name: Tear down
        if: always()
        run: docker compose down --volumes
name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  python-tests:
    name: Python tests (recommendation-ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/recommendation-ai/requirements.txt
      - name: Run pytest
        working-directory: src/recommendation-ai
        env:
          PYTHONPATH: ${{ github.workspace }}/src/recommendation-ai
        run: |
          pytest -q

  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and test
        run: |
          dotnet restore src/Recommendation.Api/Recommendation.Api.csproj
          dotnet test tests/Recommendation.Api.Tests/Recommendation.Api.Tests.csproj --verbosity minimal
      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list src/Recommendation.Api/Recommendation.Api.csproj package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [python-tests, dotnet-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Recommendation API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Recommendation.Api/Dockerfile
          push: false
          tags: recommendation-api:ci
      - name: Build Recommendation AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/recommendation-ai/Dockerfile
          push: false
          tags: recommendation-ai:ci
