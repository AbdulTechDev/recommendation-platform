version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  recommendation-ai:
    build:
      context: .
      dockerfile: ./src/recommendation-ai/Dockerfile
    depends_on:
      - postgres
    environment:
      RECOMMENDATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
  api:
    build:
      context: .
      dockerfile: ./src/Recommendation.Api/Dockerfile
    depends_on:
      - postgres
      - recommendation-ai
      - seed
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RecommendationApi__BaseUrl: "http://recommendation-ai:8000/"
      Jwt__Key: ${JWT_KEY:-dev_secret_key_please_change}
    ports:
      - "${API_HOST_PORT:-5000}:5000"
  api-init:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    depends_on:
      - postgres
    volumes:
      - ./src/Recommendation.Api:/src/Recommendation.Api
    working_dir: /src/Recommendation.Api
    entrypoint: ["/bin/sh", "-c", "dotnet tool restore || true && dotnet ef database update --no-build || true"]
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

  seed:
    build:
      context: .
      dockerfile: ./src/recommendation-ai/Dockerfile
    depends_on:
      - postgres
    environment:
      RECOMMENDATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c", "python seed_db.py"]
    restart: "no"

  frontend:
    build:
      context: ./src/recommendation-web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: "http://api:5000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
