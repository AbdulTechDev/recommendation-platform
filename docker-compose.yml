version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recommendationdb
      POSTGRES_USER: recommendation_user
      POSTGRES_PASSWORD: Recommendation@123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendation_user -d recommendationdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  recommendation-ai:
    build:
      context: .
      dockerfile: ./src/recommendation-ai/Dockerfile
    depends_on:
      - postgres
    environment:
      RECOMMENDATION_DATABASE_URL: postgresql://recommendation_user:Recommendation%40123@postgres:5432/recommendationdb
    ports:
      - "8000:8000"
  api:
    build:
      context: .
      dockerfile: ./src/Recommendation.Api/Dockerfile
    depends_on:
      - postgres
      - recommendation-ai
      - seed
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=recommendationdb;Username=recommendation_user;Password=Recommendation@123"
      RecommendationApi__BaseUrl: "http://recommendation-ai:8000/"
    ports:
      - "5000:5000"
  api-init:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    depends_on:
      - postgres
    volumes:
      - ./src/Recommendation.Api:/src/Recommendation.Api
    working_dir: /src/Recommendation.Api
    entrypoint: ["/bin/sh", "-c", "dotnet tool restore || true && dotnet ef database update --no-build || true"]
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=recommendationdb;Username=recommendation_user;Password=Recommendation@123"

  seed:
    build:
      context: .
      dockerfile: ./src/recommendation-ai/Dockerfile
    depends_on:
      - postgres
    environment:
      RECOMMENDATION_DATABASE_URL: postgresql://recommendation_user:Recommendation%40123@postgres:5432/recommendationdb
    entrypoint: ["/bin/sh", "-c", "python seed_db.py"]
    restart: "no"

volumes:
  postgres-data:
